<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch điểm danh</title>
  <!-- VAI TRÒ 2 sở hữu file này -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>📅 Lịch điểm danh</h1>

  <nav class="range-nav" aria-label="Điều hướng lịch">
    <button type="button" id="btn-prev" aria-label="Tuần hoặc tháng trước">‹</button>
    <button type="button" id="btn-today">Hôm nay</button>
    <button type="button" id="btn-next" aria-label="Tuần hoặc tháng sau">›</button>
    <span id="range-label" aria-live="polite"></span>
  </nav>

  <div class="view-switch" role="group" aria-label="Chế độ xem">
    <button type="button" id="view-week" aria-pressed="true">Tuần</button>
    <button type="button" id="view-month" aria-pressed="false">Tháng</button>
  </div>

  <!-- VAI TRÒ 5 nối sự kiện cho 3 nút này (data.js) -->
  <div class="tools">
    <button type="button" id="btn-add">+ Thêm môn / buổi học</button>
    <button type="button" id="btn-export">Xuất JSON</button>
    <label class="btn" for="file-import">Nhập JSON</label>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
  </div>
</header>

<!-- VAI TRÒ 4 hiển thị cảnh báo nghỉ > 20% ở đây -->
<div id="alert-banner" role="alert" hidden></div>

<main class="layout">

  <!-- ====== LỊCH TUẦN (table) ====== -->
  <section id="week-view" class="calendar-card" aria-label="Lịch tuần">
    <div class="table-scroll">
      <table id="week-table">
        <caption class="sr-only">Thời khóa biểu tuần, cột là các thứ, hàng là các tiết học</caption>
        <thead>
          <tr>
            <th scope="col" class="corner">Tiết</th>
            <th scope="col" data-day="1">Thứ 2<span class="d"></span></th>
            <th scope="col" data-day="2">Thứ 3<span class="d"></span></th>
            <th scope="col" data-day="3">Thứ 4<span class="d"></span></th>
            <th scope="col" data-day="4">Thứ 5<span class="d"></span></th>
            <th scope="col" data-day="5">Thứ 6<span class="d"></span></th>
            <th scope="col" data-day="6">Thứ 7<span class="d"></span></th>
            <th scope="col" data-day="7">CN<span class="d"></span></th>
          </tr>
        </thead>
        <tbody id="week-body"><!-- calendar.js dựng 10 hàng tiết --></tbody>
      </table>
    </div>
  </section>

  <!-- ====== LỊCH THÁNG (grid 7 cột) ====== -->
  <section id="month-view" class="calendar-card" aria-label="Lịch tháng" hidden>
    <div id="month-grid" class="month-grid" role="grid" aria-label="Lưới lịch tháng"></div>
  </section>

  <!-- ====== THỐNG KÊ (VAI TRÒ 4) ====== -->
  <aside id="stats-panel" class="stats-card" aria-label="Thống kê điểm danh">
    <h2>Thống kê</h2>
    <p id="stats-total">Chưa có dữ liệu điểm danh.</p>
    <table id="stats-table">
      <thead>
        <tr><th scope="col">Môn</th><th scope="col">Đã điểm danh</th><th scope="col">Nghỉ</th><th scope="col">% nghỉ</th></tr>
      </thead>
      <tbody id="stats-body"></tbody>
    </table>
    <canvas id="stats-chart" width="260" height="160" aria-label="Biểu đồ thống kê điểm danh" role="img"></canvas>
  </aside>
</main>

<footer class="legend" aria-label="Chú thích trạng thái">
  <span><i class="badge" data-status="none"></i> Chưa điểm danh</span>
  <span><i class="badge" data-status="present"></i> Có mặt</span>
  <span><i class="badge" data-status="late"></i> Đi trễ</span>
  <span><i class="badge" data-status="excused"></i> Có phép</span>
  <span><i class="badge" data-status="absent"></i> Vắng</span>
</footer>

<!-- ====== FORM THÊM / SỬA (VAI TRÒ 5 nối logic) ====== -->
<dialog id="session-dialog" aria-labelledby="dlg-title">
  <form id="session-form" method="dialog">
    <h2 id="dlg-title">Thêm buổi học</h2>
    <input type="hidden" name="id">
    <label>Tên môn <input name="subject" required maxlength="60"></label>
    <label>Thứ
      <select name="weekday">
        <option value="1">Thứ 2</option><option value="2">Thứ 3</option><option value="3">Thứ 4</option>
        <option value="4">Thứ 5</option><option value="5">Thứ 6</option><option value="6">Thứ 7</option>
        <option value="7">Chủ nhật</option>
      </select>
    </label>
    <label>Từ tiết <input type="number" name="startPeriod" min="1" max="10" value="1" required></label>
    <label>Đến tiết <input type="number" name="endPeriod" min="1" max="10" value="3" required></label>
    <label>Phòng <input name="room" maxlength="20"></label>
    <label>Màu <input type="color" name="color" value="#4f46e5"></label>
    <label class="check"><input type="checkbox" name="repeat" checked> Lặp lại hàng tuần</label>
    <menu>
      <button type="submit" value="cancel" formnovalidate>Hủy</button>
      <button type="submit" value="save">Lưu</button>
    </menu>
  </form>
</dialog>

<!-- Thứ tự nạp script QUAN TRỌNG: app → calendar → data → attendance → stats -->
<script src="js/app.js"></script>       <!-- VAI TRÒ 1: lõi dùng chung -->
<script src="js/calendar.js"></script>  <!-- VAI TRÒ 1: dựng lịch tuần/tháng -->
<script src="js/data.js"></script>      <!-- VAI TRÒ 5 -->
<script src="js/attendance.js"></script><!-- VAI TRÒ 3 -->
<script src="js/stats.js"></script>     <!-- VAI TRÒ 4 -->
</body>
</html>
